name: Render trivia episode

# The retention rebuild of render-trivia-reel.
#
# That workflow rendered a narrated statement from four flat strings. This one
# renders a GAME from one `episode` JSON payload carrying the full beat timeline
# — hook, challenge, clues, pressure, reveal, payoff, CTA — plus choices,
# figures, per-beat narration and presenter clips.
#
# One JSON input rather than a field per property, because the beat structure
# keeps growing and a workflow_dispatch input list cannot grow with it.
#
# Voice: beia_core synthesises narration per beat (ElevenLabs) and passes URLs,
# because it needs each beat's measured duration to lay out the timeline. When
# it could not, this workflow falls back to the free CPU Kokoro voice and
# measures the durations here instead. Either way the episode ships; which voice
# was used is reported, never disguised.
#
# Storage-blind: beia_core downloads the artifact and stores it in the correct
# brand's R2. Generic — every brand string is an input.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode JSON: beats, mechanic, choices, figures, presenter clips"
        required: true
      task_id:
        description: "Originating BEIA task id (names the artifact)"
        required: true
      brand_name:
        description: "Brand name"
        required: false
        default: "Ruoth"
      accent_color:
        description: "Accent colour (hex)"
        required: false
        default: "#C0392B"
      brand:
        description: "Brand identity JSON: primary, secondary, light, palette, fonts, tagline"
        required: false
        default: ""
      site_url:
        description: "Site shown on the CTA beat"
        required: false
        default: ""
      logo_url:
        description: "Brand mark, shown small in every frame except the hook"
        required: false
        default: ""
      music_url:
        description: "Royalty-free bed under the narration (optional)"
        required: false
        default: ""
      voice:
        description: "Kokoro voice id, used ONLY when no per-beat audio was supplied"
        required: false
        default: "af_heart"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The runner image already ships these. Every trivia render on
      # 2026-08-19 reported "0 newly installed" for this exact list — the only
      # thing `apt-get update` bought was its own download, which on one of
      # those runs cost 11.4 MB and 2min16s to then install nothing at all.
      # So look first, and only reach for the mirror when something is really
      # absent.
      - name: Ensure headless Chrome system libraries
        timeout-minutes: 8
        run: |
          missing=""
          # Ubuntu 24.04's t64 ABI transition renamed several of these with a
          # `t64` suffix — libasound2t64, libatk1.0-0t64, libatk-bridge2.0-0t64,
          # libcups2t64 — and the runner image carries the NEW names. A first
          # pass special-cased only libasound2, so it declared three of the
          # others missing and went to the mirror to be told "0 newly
          # installed": 102s and 11.4 MB to install nothing at all. Accept
          # either name for every package rather than tracking which ones were
          # renamed, because that list will move again.
          for p in libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2 libxrandr2 \
                   libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
                   libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2; do
            dpkg -s "$p" >/dev/null 2>&1 || dpkg -s "${p}t64" >/dev/null 2>&1 \
              || missing="$missing $p"
          done

          if [ -z "$missing" ]; then
            echo "all Chrome libraries already present in the runner image — apt not needed"
            exit 0
          fi

          echo "missing:$missing — falling back to the apt mirror"
          apt_try() {
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              -o Acquire::ForceIPv4=true \
              "$@"
          }
          apt_try update || apt_try update || true
          # shellcheck disable=SC2086
          apt_try install -y --no-install-recommends $missing \
            || apt_try install -y --no-install-recommends ${missing/libasound2t64/libasound2} \
            || true

      # ffmpeg does NOT come from the Ubuntu mirror any more.
      #
      # On 2026-08-19 that mirror served this job at 15.6 kB/s: espeak-ng's
      # 6.4 MB took 6min53s, ffmpeg's 92.8 MB never finished, and the step hit
      # its cap with no ffmpeg and no episode — three times in a row, while an
      # earlier run the same hour had been served at 31 MB/s. It is a lottery,
      # and a show on a 6x/day cadence cannot buy a ticket every time.
      #
      # A per-transfer timeout cannot rescue this. The transfer never stalls,
      # it just crawls, so Acquire::http::Timeout never fires — which is why
      # bounding apt (the previous fix) turned a 30-minute hang into a
      # 10-minute failure but still produced no video. The only real fix is to
      # stop depending on that mirror: one file from GitHub's own CDN, on the
      # network the runner is already talking to, cached so it is a
      # once-a-week cost rather than a per-render one.
      - name: Restore cached ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-linux64-gpl-v1

      - name: Fetch ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          # No sudo anywhere here: actions/cache saves as the runner user, and
          # a root-owned tree is how that save silently fails and every later
          # render pays the download again.
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p "$HOME/ffmpeg-static/bin"
          curl -sfL --retry 3 --retry-delay 5 --max-time 420 -o /tmp/ffmpeg.tar.xz "$url"
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg  "$HOME/ffmpeg-static/bin/"
          cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe "$HOME/ffmpeg-static/bin/"
          chmod +x "$HOME/ffmpeg-static/bin/ffmpeg" "$HOME/ffmpeg-static/bin/ffprobe"
          rm -rf /tmp/ffmpeg.tar.xz /tmp/ffmpeg-master-latest-linux64-gpl

      - name: Put ffmpeg on PATH and prove it runs
        run: |
          echo "$HOME/ffmpeg-static/bin" >> "$GITHUB_PATH"
          "$HOME/ffmpeg-static/bin/ffmpeg"  -version | head -1
          "$HOME/ffmpeg-static/bin/ffprobe" -version | head -1
          # Prove the exact filter chain the presenter trim needs, rather than
          # assuming a binary that answers -version can do the work. A missing
          # or incapable ffmpeg does NOT fail the trim below — it keeps the
          # letterboxed clip and ships an episode with the presenter as a
          # stripe across the middle. That is a false success, so it dies here.
          "$HOME/ffmpeg-static/bin/ffmpeg" -v error -f lavfi -i color=c=black:s=64x64:d=1 \
            -frames:v 1 -vf "scale=32:192:flags=area,format=gray" \
            -f rawvideo -y /dev/null
          echo "ffmpeg can run the presenter-trim filter chain"

      - name: Install Node dependencies
        run: npm install

      - name: Validate episode payload
        id: episode
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          node -e '
            const fs = require("fs");
            let ep;
            try { ep = JSON.parse(process.env.EPISODE || "{}"); }
            catch (e) { console.error("episode is not valid JSON: " + e.message); process.exit(1); }
            const beats = ep.beats || [];
            if (!beats.length) { console.error("episode has no beats"); process.exit(1); }
            const named = beats.map(b => b.beat);
            if (!named.includes("hook")) { console.error("episode has no hook beat"); process.exit(1); }
            if (!named.includes("reveal")) { console.error("episode has no reveal beat"); process.exit(1); }
            const withAudio = beats.filter(b => b.audio_url).length;
            fs.writeFileSync("episode.json", JSON.stringify(ep));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              "needs_tts=" + (withAudio === beats.length ? "false" : "true") + "\n");
            console.log("beats: " + beats.length + " (" + named.join(" -> ") + ")");
            console.log("beats carrying supplied audio: " + withAudio + "/" + beats.length);
          '

      # Every remote asset is fetched HERE, never during the render: a fetch that
      # fails mid-render kills an otherwise finished episode, and curl succeeding
      # does not mean Remotion's own fetch will succeed.
      - name: Download supplied narration + presenter clips
        run: |
          mkdir -p public
          node -e '
            const fs = require("fs");
            const ep = JSON.parse(fs.readFileSync("episode.json", "utf8"));
            const jobs = [];
            (ep.beats || []).forEach((b, i) => {
              if (b.audio_url) jobs.push([b.audio_url, "beat-" + i + ".mp3", () => { b.audio_url = "beat-" + i + ".mp3"; }]);
            });
            (ep.presenter_clips || []).forEach((p, i) => {
              if (p.video_url) jobs.push([p.video_url, "presenter-" + i + ".mp4", () => { p.video_url = "presenter-" + i + ".mp4"; }]);
            });
            // The still IS the challenge on a visual format, so a failed fetch
            // must fail the render rather than silently shipping a text-only
            // version of a picture quiz.
            if (ep.image_url) jobs.push([ep.image_url, "still.png", () => {}]);
            if (ep.reveal_image_url) jobs.push([ep.reveal_image_url, "reveal.png", () => {}]);
            // Shot-plan pictures. Same up-front rule as everything else: a
            // fetch that fails mid-render kills an otherwise finished episode,
            // so every asset is on disk before Remotion starts. Deduped by URL
            // because two shots may legitimately share one picture.
            {
              const seen = new Map();
              (ep.shots || []).forEach((s, i) => {
                if (!s.media_url) return;
                if (!seen.has(s.media_url)) {
                  const ext = /\.(mp4|mov|webm)(\?|$)/i.test(s.media_url) ? "mp4" : "png";
                  seen.set(s.media_url, "shot-" + i + "." + ext);
                  jobs.push([s.media_url, seen.get(s.media_url), () => {}]);
                }
              });
            }
            fs.writeFileSync("download_jobs.json", JSON.stringify(jobs.map(j => [j[0], j[1]])));
            fs.writeFileSync("episode.json", JSON.stringify(ep));
            console.log("assets to fetch: " + jobs.length);
          '
          node -e '
            const jobs = require("./download_jobs.json");
            for (const [url, name] of jobs) console.log(url + "\t" + name);
          ' | while IFS=$'\t' read -r url name; do
            [ -z "$url" ] && continue
            if curl -sfL --retry 3 --retry-delay 2 --max-time 90 -o "public/$name" "$url"; then
              echo "fetched $name"
            else
              echo "FAILED to fetch $name from $url"; exit 1
            fi
          done
          # Trim the letterbox off the presenter clips.
          #
          # A photo-avatar look is 16:9, so HeyGen returns it as a band with
          # black above and below and the presenter showed up as a stripe in the
          # middle of the episode.  The trim leaves a genuinely vertical avatar
          # untouched, so both kinds of look come out right.
          for f in public/presenter-*.mp4; do
            [ -e "$f" ] || continue
            box=$(python3 scripts/crop-presenter.py "$f" || true)
            if [ -z "$box" ]; then
              echo "$(basename "$f") already fills its frame"; continue
            fi
            out="${f%.mp4}-trim.mp4"
            if ffmpeg -v error -i "$f" -vf "$box" -c:a copy "$out" -y; then
              mv -f "$out" "$f"
              echo "trimmed $(basename "$f") to ${box}"
            else
              rm -f "$out"; echo "trim FAILED for $(basename "$f") -- keeping the original"
            fi
          done

          # Rewrite the payload to the bare filenames the component resolves.
          node -e '
            const fs = require("fs");
            const ep = JSON.parse(fs.readFileSync("episode.json", "utf8"));
            const jobs = require("./download_jobs.json");
            const byUrl = new Map(jobs);
            (ep.beats || []).forEach(b => { if (b.audio_url && byUrl.has(b.audio_url)) b.audio_url = byUrl.get(b.audio_url); });
            (ep.presenter_clips || []).forEach(p => { if (p.video_url && byUrl.has(p.video_url)) p.video_url = byUrl.get(p.video_url); });
            if (ep.image_url && byUrl.has(ep.image_url)) ep.image_url = byUrl.get(ep.image_url);
            if (ep.reveal_image_url && byUrl.has(ep.reveal_image_url)) ep.reveal_image_url = byUrl.get(ep.reveal_image_url);
            (ep.shots || []).forEach(s => { if (s.media_url && byUrl.has(s.media_url)) s.media_url = byUrl.get(s.media_url); });
            fs.writeFileSync("episode.json", JSON.stringify(ep));
          '

      # espeak-ng lives HERE, not in the setup block, because it is Kokoro's
      # phonemiser and Kokoro only runs when beia_core could not supply the
      # narration. On 2026-08-19 an episode that HAD its ElevenLabs narration
      # still spent 6min53s dragging espeak-ng's 6.4 MB off a 15.6 kB/s mirror
      # — and that was the delay that left ffmpeg no time and killed the
      # render. Paying for the fallback on every run of the happy path is how
      # the happy path died.
      - name: Install Kokoro TTS + its phonemiser (only when narration was not supplied)
        if: steps.episode.outputs.needs_tts == 'true'
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            update || true
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            install -y --no-install-recommends espeak-ng || true
          command -v espeak-ng >/dev/null \
            && echo "espeak-ng: present" \
            || echo "espeak-ng: MISSING — Kokoro will fall back to its own phonemiser"
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile numpy

      - name: Synthesize missing narration with the free voice
        if: steps.episode.outputs.needs_tts == 'true'
        env:
          VOICE: ${{ inputs.voice }}
        run: |
          mkdir -p public
          node -e '
            const fs = require("fs");
            const ep = JSON.parse(fs.readFileSync("episode.json", "utf8"));
            const chunks = (ep.beats || []).map(b => b.spoken || b.display || "");
            fs.writeFileSync("narration_spec.json", JSON.stringify({
              voice: process.env.VOICE || "af_heart", speed: 1.0, chunks,
            }));
            console.log("kokoro chunks: " + chunks.length);
          '
          python scripts/generate_narration.py --spec narration_spec.json --outdir public
          # Each chunk is one beat, so its measured duration IS that beat's
          # duration — which is the whole reason narration is chunked per beat.
          node -e '
            const fs = require("fs");
            const ep = JSON.parse(fs.readFileSync("episode.json", "utf8"));
            const caps = JSON.parse(fs.readFileSync("public/captions.json", "utf8"));
            (ep.beats || []).forEach((b, i) => {
              const c = caps[i];
              if (c) b.duration_seconds = (c.endMs - c.startMs) / 1000;
            });
            fs.writeFileSync("episode.json", JSON.stringify(ep));
            console.log("beat durations taken from kokoro timings");
          '

      - name: Check music reachability
        id: music
        env:
          MUSIC_URL: ${{ inputs.music_url }}
        run: |
          if [ -z "$MUSIC_URL" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "no music requested"; exit 0
          fi
          mkdir -p public
          if curl -sfL --retry 3 --retry-delay 2 --max-time 45 -o public/music.mp3 "$MUSIC_URL"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "music downloaded to public/music.mp3"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "music UNREACHABLE — rendering silent"
          fi

      - name: Build render props
        env:
          MUSIC_URL: ${{ steps.music.outputs.ok == 'true' && 'music.mp3' || '' }}
          LOGO_URL: ${{ inputs.logo_url }}
          SITE_URL: ${{ inputs.site_url }}
          BRAND_NAME: ${{ inputs.brand_name }}
          ACCENT_COLOR: ${{ inputs.accent_color }}
          BRAND_JSON: ${{ inputs.brand }}
          NARRATION_FALLBACK: ${{ steps.episode.outputs.needs_tts == 'true' && 'narration.wav' || '' }}
        run: |
          node -e '
            const fs = require("fs");
            const episode = JSON.parse(fs.readFileSync("episode.json", "utf8"));
            const props = {
              episode,
              brandName: process.env.BRAND_NAME || "Ruoth",
              accentColor: process.env.ACCENT_COLOR || "#C0392B",
              siteUrl: process.env.SITE_URL || "",
            };
            if (process.env.LOGO_URL) props.logoUrl = process.env.LOGO_URL;
            if (process.env.MUSIC_URL) props.musicUrl = process.env.MUSIC_URL;
            if (process.env.BRAND_JSON) {
              try { props.brand = JSON.parse(process.env.BRAND_JSON); }
              catch (e) { console.log("brand JSON unreadable, using defaults: " + e.message); }
            }
            // Only used when no per-beat audio exists at all.
            const anyBeatAudio = (episode.beats || []).some(b => b.audio_url);
            if (!anyBeatAudio && process.env.NARRATION_FALLBACK) {
              props.narrationUrl = process.env.NARRATION_FALLBACK;
            }
            fs.writeFileSync("props.json", JSON.stringify(props));
            const total = (episode.beats || []).reduce((s, b) => s + (b.duration_seconds || 0), 0);
            console.log("beats: " + (episode.beats || []).length +
              ", total narration: " + total.toFixed(2) + "s" +
              ", presenter clips: " + (episode.presenter_clips || []).length);
          '

      - name: Render trivia episode
        run: |
          npx remotion render src/index.ts TriviaEpisode out/episode.mp4 \
            --props=props.json \
            --log=info

      - name: Verify the render is real
        run: |
          # A workflow that concludes "success" having produced a 0-byte file is
          # exactly the false success the doctrine forbids. Check it.
          test -s out/episode.mp4 || { echo "render produced no file"; exit 1; }
          size=$(stat -c%s out/episode.mp4)
          echo "rendered $size bytes"
          [ "$size" -gt 20000 ] || { echo "render suspiciously small — treating as failed"; exit 1; }

      # Frames for the visual QA gate. Extracted HERE because this runner has
      # ffmpeg and the Railway worker does not — and because a reviewer that
      # cannot see the episode is not reviewing it, it is reading a file size.
      # One frame at the midpoint of every beat, so QA sees each state of the
      # game rather than whatever moment a fixed interval happened to land on.
      - name: Extract frames for visual QA
        run: |
          mkdir -p out/frames
          node -e '
            const fs = require("fs");
            const ep = JSON.parse(fs.readFileSync("episode.json", "utf8"));
            let at = 0;
            const marks = [];
            for (const b of ep.beats || []) {
              const d = b.duration_seconds && b.duration_seconds > 0
                ? b.duration_seconds
                : Math.max(0.9, String(b.spoken || "").split(/\s+/).filter(Boolean).length / 2.4);
              marks.push({ beat: b.beat, at: +(at + d / 2).toFixed(2) });
              at += d;
            }
            fs.writeFileSync("frames.json", JSON.stringify(marks));
            console.log(marks.map(m => m.beat + "@" + m.at + "s").join("  "));
          '
          # Remotion's own bundled ffmpeg. The runner image does not ship one —
          # a first attempt used a bare `ffmpeg` and every extraction failed
          # with "command not found", which failed the render of a video that
          # had actually been made correctly.
          for row in $(node -e 'require("./frames.json").forEach((m,i)=>console.log(i+":"+m.beat+":"+m.at))'); do
            idx=${row%%:*}; rest=${row#*:}; beat=${rest%%:*}; at=${rest##*:}
            npx remotion ffmpeg -v error -ss "$at" -i out/episode.mp4 -frames:v 1 \
              -vf "scale=540:-1" "out/frames/$(printf '%02d' "$idx")-${beat}.jpg" -y || true
          done
          cp frames.json out/frames/manifest.json
          ls -la out/frames/
          # No frames means QA would have to pass blind, which it must never do.
          test "$(ls out/frames/*.jpg 2>/dev/null | wc -l)" -gt 0 \
            || { echo "no frames extracted — visual QA would be blind"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: triviaepisode-${{ inputs.task_id }}
          path: |
            out/episode.mp4
            out/frames
          retention-days: 3
