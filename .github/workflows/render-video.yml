name: Render video

# Shared BEIA render service. Triggered by beia_core's remotion_video_tool via
# the GitHub API (workflow_dispatch). Renders the generic QuoteReel from the
# card image URLs and uploads the mp4 as an artifact. It is storage-blind:
# beia_core downloads the artifact and stores it in the correct brand's R2.

on:
  workflow_dispatch:
    inputs:
      images:
        description: "JSON array of card image URLs"
        required: true
      task_id:
        description: "Originating BEIA task id (names the artifact)"
        required: true
      brand_name:
        description: "Brand name shown on the end card"
        required: false
        default: "BEIA"
      accent_color:
        description: "Accent colour (hex) for the progress bar"
        required: false
        default: "#F97316"
      music_url:
        description: "Owned or licensed music track URL for the quote reel"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The runner image already ships these. Every render on 2026-08-19
      # reported "0 newly installed" for this exact list — the only thing
      # `apt-get update` bought was its own download, which on one of those
      # runs cost 11.4 MB and 2min16s to then install nothing at all. So look
      # first, and only reach for the mirror when something is really absent.
      - name: Ensure headless Chrome system libraries
        timeout-minutes: 8
        run: |
          missing=""
          for p in libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libxrandr2 \
                   libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
                   libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          # The ALSA package was renamed for the t64 ABI transition, so accept
          # whichever of the two this image carries.
          dpkg -s libasound2t64 >/dev/null 2>&1 || dpkg -s libasound2 >/dev/null 2>&1 \
            || missing="$missing libasound2t64"

          if [ -z "$missing" ]; then
            echo "all Chrome libraries already present in the runner image — apt not needed"
            exit 0
          fi

          echo "missing:$missing — falling back to the apt mirror"
          apt_try() {
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              -o Acquire::ForceIPv4=true \
              "$@"
          }
          apt_try update || apt_try update || true
          # shellcheck disable=SC2086
          apt_try install -y --no-install-recommends $missing \
            || apt_try install -y --no-install-recommends ${missing/libasound2t64/libasound2} \
            || true
      - name: Install dependencies
        run: npm install

      - name: Build render props
        env:
          IMAGES: ${{ inputs.images }}
          BRAND_NAME: ${{ inputs.brand_name }}
          ACCENT_COLOR: ${{ inputs.accent_color }}
          MUSIC_URL: ${{ inputs.music_url }}
        run: |
          if [ -n "$MUSIC_URL" ]; then
            curl --fail --location --silent --show-error "$MUSIC_URL" --output public/retention-music.mp3
            test -s public/retention-music.mp3
          fi
          node -e '
            const images = JSON.parse(process.env.IMAGES || "[]");
            if (!Array.isArray(images) || images.length === 0) {
              console.error("no images provided"); process.exit(1);
            }
            const props = {
              images,
              brandName: process.env.BRAND_NAME || "BEIA",
              accentColor: process.env.ACCENT_COLOR || "#F97316",
              musicUrl: process.env.MUSIC_URL ? "retention-music.mp3" : undefined,
            };
            require("fs").writeFileSync("props.json", JSON.stringify(props));
            console.log("props: " + images.length + " images, brand " + props.brandName);
          '

      - name: Render reel
        run: |
          mkdir -p out
          npx remotion render QuoteReel out/reel.mp4 --props=./props.json --concurrency=1 --log=verbose

      - name: Upload rendered mp4
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.task_id }}
          path: out/reel.mp4
          retention-days: 1
          if-no-files-found: error
