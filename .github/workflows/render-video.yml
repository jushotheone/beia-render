name: Render video

# Shared BEIA render service. Triggered by beia_core's remotion_video_tool via
# the GitHub API (workflow_dispatch). Renders the generic QuoteReel from the
# card image URLs and uploads the mp4 as an artifact. It is storage-blind:
# beia_core downloads the artifact and stores it in the correct brand's R2.

on:
  workflow_dispatch:
    inputs:
      images:
        description: "JSON array of card image URLs"
        required: true
      task_id:
        description: "Originating BEIA task id (names the artifact)"
        required: true
      brand_name:
        description: "Brand name shown on the end card"
        required: false
        default: "BEIA"
      accent_color:
        description: "Accent colour (hex) for the progress bar"
        required: false
        default: "#F97316"
      music_url:
        description: "Owned or licensed music track URL for the quote reel"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install headless Chrome system libraries
        # apt on the hosted runners can stall indefinitely. The Azure mirror
        # Ign's out, the fallback to archive.ubuntu.com hangs mid-transfer, and
        # apt has no timeout of its own — so the step sits there until the job
        # budget runs out. On 2026-08-19 that wedged three consecutive trivia
        # renders for the full 30 minutes each and the show shipped nothing all
        # morning. Bound every transfer, retry it, force IPv4 (the usual cause
        # of the stall), and cap the step: a slow mirror must cost minutes, not
        # the whole render.
        timeout-minutes: 10
        run: |
          apt_try() {
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              -o Acquire::ForceIPv4=true \
              "$@"
          }
          apt_try update || apt_try update || true
          apt_try install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 \
          || apt_try install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 \
          || true
          # Say what actually landed rather than assuming it did. None of these
          # is fatal here on its own — the Chrome libraries are normally already
          # in the runner image, and the render fails loudly further down if
          # something it truly needs is missing. But a silent partial install is
          # how a render "succeeds" into an unwatchable file.
          echo "chrome libraries step done"

      - name: Install dependencies
        run: npm install

      - name: Build render props
        env:
          IMAGES: ${{ inputs.images }}
          BRAND_NAME: ${{ inputs.brand_name }}
          ACCENT_COLOR: ${{ inputs.accent_color }}
          MUSIC_URL: ${{ inputs.music_url }}
        run: |
          if [ -n "$MUSIC_URL" ]; then
            curl --fail --location --silent --show-error "$MUSIC_URL" --output public/retention-music.mp3
            test -s public/retention-music.mp3
          fi
          node -e '
            const images = JSON.parse(process.env.IMAGES || "[]");
            if (!Array.isArray(images) || images.length === 0) {
              console.error("no images provided"); process.exit(1);
            }
            const props = {
              images,
              brandName: process.env.BRAND_NAME || "BEIA",
              accentColor: process.env.ACCENT_COLOR || "#F97316",
              musicUrl: process.env.MUSIC_URL ? "retention-music.mp3" : undefined,
            };
            require("fs").writeFileSync("props.json", JSON.stringify(props));
            console.log("props: " + images.length + " images, brand " + props.brandName);
          '

      - name: Render reel
        run: |
          mkdir -p out
          npx remotion render QuoteReel out/reel.mp4 --props=./props.json --concurrency=1 --log=verbose

      - name: Upload rendered mp4
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.task_id }}
          path: out/reel.mp4
          retention-days: 1
          if-no-files-found: error
