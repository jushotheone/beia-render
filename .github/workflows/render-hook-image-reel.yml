name: Render hook image reel

# Shared BEIA render service — repurpose short from a STILL. Sibling of
# render-hook-reel.yml, for legacy campaigns whose pins are .jpg rather than
# .mp4 (Ruoth's Launch Campaign). Same typed hook intro, then the still held
# with a slow push so it reads as motion on short-form. Storage-blind:
# beia_core downloads the artifact and stores it in the brand's R2.

on:
  workflow_dispatch:
    inputs:
      hook:
        description: "The hook line typed on the white intro card"
        required: true
      image_url:
        description: "URL of the still (jpg/png) shown after the intro"
        required: true
      music_url:
        description: "Royalty-free music track baked over the reel (optional)"
        required: false
        default: ""
      hold_seconds:
        description: "How long the still is held (default 8)"
        required: false
        default: "8"
      task_id:
        description: "Originating BEIA task id (names the artifact)"
        required: true
      brand_name:
        description: "Brand name"
        required: false
        default: "Ruoth"
      accent_color:
        description: "Accent colour (hex) for the typewriter cursor"
        required: false
        default: "#C0392B"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install headless Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || \
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install dependencies
        run: npm install

      # Music is a nice-to-have; it must never be able to fail a render. The
      # track host (incompetech) intermittently times out from GitHub runners,
      # which killed a whole reel mid-render. Probe it first and drop it if it
      # is not reachable — a silent video beats no video.
      - name: Check music reachability
        id: music
        env:
          MUSIC_URL: ${{ inputs.music_url }}
        run: |
          if [ -z "$MUSIC_URL" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "no music requested"; exit 0
          fi
          mkdir -p public
          # Download it HERE so the renderer never fetches over the network:
          # curl succeeding does not mean Remotion's own fetch will succeed.
          if curl -sfL --retry 3 --retry-delay 2 --max-time 45 -o public/music.mp3 "$MUSIC_URL"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "music downloaded to public/music.mp3"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "music UNREACHABLE — rendering silent"
          fi

      - name: Build render props
        env:
          HOOK: ${{ inputs.hook }}
          IMAGE_URL: ${{ inputs.image_url }}
          MUSIC_URL: ${{ steps.music.outputs.ok == 'true' && 'music.mp3' || '' }}
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
          BRAND_NAME: ${{ inputs.brand_name }}
          ACCENT_COLOR: ${{ inputs.accent_color }}
        run: |
          node -e '
            const hook = process.env.HOOK || "";
            const imageUrl = process.env.IMAGE_URL || "";
            if (!imageUrl) { console.error("no image_url provided"); process.exit(1); }
            const props = {
              hook,
              imageUrl,
              brandName: process.env.BRAND_NAME || "Ruoth",
              accentColor: process.env.ACCENT_COLOR || "#C0392B",
            };
            const hold = parseFloat(process.env.HOLD_SECONDS || "8");
            if (!Number.isNaN(hold) && hold > 0) props.holdSeconds = hold;
            if (process.env.MUSIC_URL) props.musicUrl = process.env.MUSIC_URL;
            require("fs").writeFileSync("props.json", JSON.stringify(props));
            console.log("props: hook=\"" + hook + "\" image=" + imageUrl +
              " hold=" + hold + " music=" + (process.env.MUSIC_URL||"(none)"));
          '

      - name: Render hook image reel
        run: |
          mkdir -p out
          npx remotion render HookImageReel out/reel.mp4 --props=./props.json --concurrency=1 --log=verbose

      - name: Upload rendered mp4
        uses: actions/upload-artifact@v4
        with:
          name: hookimagereel-${{ inputs.task_id }}
          path: out/reel.mp4
          retention-days: 1
          if-no-files-found: error
