name: Render trivia reel

# Shared BEIA render service — content CREATION (as opposed to render-hook-reel,
# which repurposes an existing clip). Manufactures a faceless trivia Short from
# text alone: a free CPU-only Kokoro TTS voice narrates it, captions are timed
# exactly to that voice, and the generic TriviaReel composition renders it.
# Storage-blind: beia_core downloads the artifact and stores it in the correct
# brand's R2. Generic — every brand string is an input.

on:
  workflow_dispatch:
    inputs:
      question:
        description: "The trivia question shown and narrated"
        required: true
      answer:
        description: "The answer revealed near the end"
        required: true
      pillar:
        description: "Content pillar label shown on the intro card"
        required: false
        default: ""
      narration:
        description: "Narration script; ~one phrase per line (blank = question + answer)"
        required: false
        default: ""
      voice:
        description: "Kokoro voice id (af_heart, af_bella, bm_george, ...)"
        required: false
        default: "af_heart"
      music_url:
        description: "Royalty-free music track baked under the narration (optional)"
        required: false
        default: ""
      logo_url:
        description: "Brand logo shown on intro + end card (optional)"
        required: false
        default: ""
      site_url:
        description: "Site shown on the end card"
        required: false
        default: ""
      task_id:
        description: "Originating BEIA task id (names the artifact)"
        required: true
      brand_name:
        description: "Brand name"
        required: false
        default: "Ruoth"
      accent_color:
        description: "Accent colour (hex)"
        required: false
        default: "#C0392B"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install headless Chrome system libraries + espeak-ng
        run: |
          sudo apt-get update
          # espeak-ng is Kokoro's phonemiser fallback
          sudo apt-get install -y espeak-ng
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || \
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install Node dependencies
        run: npm install

      - name: Install Kokoro TTS (CPU torch — no GPU, no paid API)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile numpy

      - name: Build narration spec
        env:
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
          NARRATION: ${{ inputs.narration }}
          VOICE: ${{ inputs.voice }}
        run: |
          node -e '
            const q = process.env.QUESTION || "";
            const a = process.env.ANSWER || "";
            if (!q) { console.error("no question provided"); process.exit(1); }
            let chunks;
            const narration = (process.env.NARRATION || "").trim();
            if (narration) {
              chunks = narration.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
            } else {
              // Default script: ask, beat, answer.
              chunks = [q, "Think about it.", a].filter(Boolean);
            }
            const spec = { voice: process.env.VOICE || "af_heart", speed: 1.0, chunks };
            require("fs").writeFileSync("narration_spec.json", JSON.stringify(spec));
            console.log("narration chunks: " + chunks.length);
          '

      - name: Synthesize narration + exact caption timings
        run: |
          mkdir -p public
          # Do NOT capture stdout into a shell var: kokoro downloads a spaCy model
          # on first use and prints to stdout, so the duration line is not alone.
          # The render props step reads public/captions.json for the real timings.
          python scripts/generate_narration.py --spec narration_spec.json --outdir public
          ls -la public/

      # Music must never be able to fail a render — the track host intermittently
      # times out from GitHub runners. Probe it; drop it if unreachable.
      - name: Check music reachability
        id: music
        env:
          MUSIC_URL: ${{ inputs.music_url }}
        run: |
          if [ -z "$MUSIC_URL" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "no music requested"; exit 0
          fi
          mkdir -p public
          # Download it HERE so the renderer never fetches over the network:
          # curl succeeding does not mean Remotion's own fetch will succeed.
          if curl -sfL --retry 3 --retry-delay 2 --max-time 45 -o public/music.mp3 "$MUSIC_URL"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "music downloaded to public/music.mp3"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "music UNREACHABLE — rendering silent"
          fi

      - name: Build render props
        env:
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
          PILLAR: ${{ inputs.pillar }}
          MUSIC_URL: ${{ steps.music.outputs.ok == 'true' && 'music.mp3' || '' }}
          LOGO_URL: ${{ inputs.logo_url }}
          SITE_URL: ${{ inputs.site_url }}
          BRAND_NAME: ${{ inputs.brand_name }}
          ACCENT_COLOR: ${{ inputs.accent_color }}
        run: |
          node -e '
            const fs = require("fs");
            const captions = JSON.parse(fs.readFileSync("public/captions.json", "utf8"));
            const props = {
              question: process.env.QUESTION || "",
              answer: process.env.ANSWER || "",
              pillar: process.env.PILLAR || "",
              captions,
              brandName: process.env.BRAND_NAME || "Ruoth",
              accentColor: process.env.ACCENT_COLOR || "#C0392B",
              siteUrl: process.env.SITE_URL || "",
            };
            if (process.env.LOGO_URL) props.logoUrl = process.env.LOGO_URL;
            if (process.env.MUSIC_URL) props.musicUrl = process.env.MUSIC_URL;
            fs.writeFileSync("props.json", JSON.stringify(props));
            console.log("captions: " + captions.length + ", last endMs: " +
              (captions.length ? captions[captions.length - 1].endMs : 0));
          '

      - name: Render trivia reel
        run: |
          mkdir -p out
          npx remotion render TriviaReel out/reel.mp4 --props=./props.json --concurrency=1 --log=verbose

      - name: Upload rendered mp4
        uses: actions/upload-artifact@v4
        with:
          name: triviareel-${{ inputs.task_id }}
          path: out/reel.mp4
          retention-days: 1
          if-no-files-found: error
