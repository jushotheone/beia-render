name: Render design

# Shared BEIA design render service. Triggered by beia_core's design_tool via the
# GitHub API (workflow_dispatch). Renders the flexible OfferCard composition from a
# design spec (JSON) as a still PNG and uploads it as an artifact. Storage-blind:
# beia_core downloads the artifact and stores it in the correct brand's R2.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "JSON design spec (headline, subhead, price, cta, productImage, brandName, accentColor, layout, ...)"
        required: true
      task_id:
        description: "Originating BEIA task id (names the artifact)"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install headless Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || \
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install dependencies
        run: npm install

      - name: Build render props
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          node -e '
            let spec;
            try { spec = JSON.parse(process.env.SPEC || "{}"); }
            catch (e) { console.error("invalid spec JSON: " + e.message); process.exit(1); }
            if (!spec || !spec.headline) {
              console.error("design spec requires a headline"); process.exit(1);
            }
            const props = {
              headline: spec.headline,
              subhead: spec.subhead || "",
              price: spec.price || "",
              cta: spec.cta || "Shop now",
              productImage: spec.productImage || "",
              brandName: spec.brandName || "BEIA",
              accentColor: spec.accentColor || "#C0392B",
              background: spec.background || "#FFFFFF",
              textColor: spec.textColor || "#111111",
              layout: spec.layout || "",
            };
            require("fs").writeFileSync("props.json", JSON.stringify(props));
            console.log("props: layout " + (props.layout || "auto") + ", brand " + props.brandName);
          '

      - name: Render offer card (still)
        run: |
          mkdir -p out
          npx remotion still OfferCard out/card.png --props=./props.json --log=verbose

      - name: Upload rendered card
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ inputs.task_id }}
          path: out/card.png
          retention-days: 1
          if-no-files-found: error
