name: Render design

# Shared BEIA design render service. Triggered by beia_core's design_tool via the
# GitHub API (workflow_dispatch). Renders the flexible OfferCard composition from a
# design spec (JSON) as a still PNG and uploads it as an artifact. Storage-blind:
# beia_core downloads the artifact and stores it in the correct brand's R2.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "JSON design spec (headline, subhead, price, cta, productImage, brandName, accentColor, layout, ...)"
        required: true
      task_id:
        description: "Originating BEIA task id (names the artifact)"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The runner image already ships these. Every render on 2026-08-19
      # reported "0 newly installed" for this exact list — the only thing
      # `apt-get update` bought was its own download, which on one of those
      # runs cost 11.4 MB and 2min16s to then install nothing at all. So look
      # first, and only reach for the mirror when something is really absent.
      - name: Ensure headless Chrome system libraries
        timeout-minutes: 8
        run: |
          missing=""
          # Ubuntu 24.04's t64 ABI transition renamed several of these with a
          # `t64` suffix — libasound2t64, libatk1.0-0t64, libatk-bridge2.0-0t64,
          # libcups2t64 — and the runner image carries the NEW names. A first
          # pass special-cased only libasound2, so it declared three of the
          # others missing and went to the mirror to be told "0 newly
          # installed": 102s and 11.4 MB to install nothing at all. Accept
          # either name for every package rather than tracking which ones were
          # renamed, because that list will move again.
          for p in libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2 libxrandr2 \
                   libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
                   libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2; do
            dpkg -s "$p" >/dev/null 2>&1 || dpkg -s "${p}t64" >/dev/null 2>&1 \
              || missing="$missing $p"
          done

          if [ -z "$missing" ]; then
            echo "all Chrome libraries already present in the runner image — apt not needed"
            exit 0
          fi

          echo "missing:$missing — falling back to the apt mirror"
          apt_try() {
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              -o Acquire::ForceIPv4=true \
              "$@"
          }
          apt_try update || apt_try update || true
          # shellcheck disable=SC2086
          apt_try install -y --no-install-recommends $missing \
            || apt_try install -y --no-install-recommends ${missing/libasound2t64/libasound2} \
            || true
      - name: Install dependencies
        run: npm install

      - name: Build render props
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          node -e '
            let spec;
            try { spec = JSON.parse(process.env.SPEC || "{}"); }
            catch (e) { console.error("invalid spec JSON: " + e.message); process.exit(1); }
            if (!spec || !spec.headline) {
              console.error("design spec requires a headline"); process.exit(1);
            }
            const props = {
              headline: spec.headline,
              subhead: spec.subhead || "",
              price: spec.price || "",
              cta: spec.cta || "Shop now",
              productImage: spec.productImage || "",
              brandName: spec.brandName || "BEIA",
              accentColor: spec.accentColor || "#C0392B",
              background: spec.background || "#FFFFFF",
              textColor: spec.textColor || "#111111",
              layout: spec.layout || "",
            };
            require("fs").writeFileSync("props.json", JSON.stringify(props));
            console.log("props: layout " + (props.layout || "auto") + ", brand " + props.brandName);
          '

      - name: Render offer card (still)
        run: |
          mkdir -p out
          npx remotion still OfferCard out/card.png --props=./props.json --log=verbose

      - name: Upload rendered card
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ inputs.task_id }}
          path: out/card.png
          retention-days: 1
          if-no-files-found: error
