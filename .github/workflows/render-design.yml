name: Render design

# Shared BEIA design render service. Triggered by beia_core's design_tool via the
# GitHub API (workflow_dispatch). Renders the flexible OfferCard composition from a
# design spec (JSON) as a still PNG and uploads it as an artifact. Storage-blind:
# beia_core downloads the artifact and stores it in the correct brand's R2.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "JSON design spec (headline, subhead, price, cta, productImage, brandName, accentColor, layout, ...)"
        required: true
      task_id:
        description: "Originating BEIA task id (names the artifact)"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install headless Chrome system libraries
        # apt on the hosted runners can stall indefinitely. The Azure mirror
        # Ign's out, the fallback to archive.ubuntu.com hangs mid-transfer, and
        # apt has no timeout of its own — so the step sits there until the job
        # budget runs out. On 2026-08-19 that wedged three consecutive trivia
        # renders for the full 30 minutes each and the show shipped nothing all
        # morning. Bound every transfer, retry it, force IPv4 (the usual cause
        # of the stall), and cap the step: a slow mirror must cost minutes, not
        # the whole render.
        timeout-minutes: 10
        run: |
          apt_try() {
            sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              -o Acquire::ForceIPv4=true \
              "$@"
          }
          apt_try update || apt_try update || true
          apt_try install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 \
          || apt_try install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 \
          || true
          # Say what actually landed rather than assuming it did. None of these
          # is fatal here on its own — the Chrome libraries are normally already
          # in the runner image, and the render fails loudly further down if
          # something it truly needs is missing. But a silent partial install is
          # how a render "succeeds" into an unwatchable file.
          echo "chrome libraries step done"

      - name: Install dependencies
        run: npm install

      - name: Build render props
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          node -e '
            let spec;
            try { spec = JSON.parse(process.env.SPEC || "{}"); }
            catch (e) { console.error("invalid spec JSON: " + e.message); process.exit(1); }
            if (!spec || !spec.headline) {
              console.error("design spec requires a headline"); process.exit(1);
            }
            const props = {
              headline: spec.headline,
              subhead: spec.subhead || "",
              price: spec.price || "",
              cta: spec.cta || "Shop now",
              productImage: spec.productImage || "",
              brandName: spec.brandName || "BEIA",
              accentColor: spec.accentColor || "#C0392B",
              background: spec.background || "#FFFFFF",
              textColor: spec.textColor || "#111111",
              layout: spec.layout || "",
            };
            require("fs").writeFileSync("props.json", JSON.stringify(props));
            console.log("props: layout " + (props.layout || "auto") + ", brand " + props.brandName);
          '

      - name: Render offer card (still)
        run: |
          mkdir -p out
          npx remotion still OfferCard out/card.png --props=./props.json --log=verbose

      - name: Upload rendered card
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ inputs.task_id }}
          path: out/card.png
          retention-days: 1
          if-no-files-found: error
